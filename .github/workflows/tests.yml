name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict --no-check-lock

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '10', testbench: '^8.0', phpunit: '^10.5' }
          - { php: '8.3', laravel: '10', testbench: '^8.0', phpunit: '^10.5' }
          - { php: '8.2', laravel: '11', testbench: '^9.0', phpunit: '^10.5|^11.0' }
          - { php: '8.3', laravel: '11', testbench: '^9.0', phpunit: '^10.5|^11.0' }
          - { php: '8.4', laravel: '11', testbench: '^9.0', phpunit: '^10.5|^11.0' }
          - { php: '8.2', laravel: '12', testbench: '^10.0', phpunit: '^11.0' }
          - { php: '8.3', laravel: '12', testbench: '^10.0', phpunit: '^11.0' }
          - { php: '8.4', laravel: '12', testbench: '^10.0', phpunit: '^11.0' }
          - { php: '8.3', laravel: '13', testbench: '^11.0', phpunit: '^12.0' }
          - { php: '8.4', laravel: '13', testbench: '^11.0', phpunit: '^12.0' }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          # Laravel 10 and 11 are end-of-life and every release has a published advisory;
          # Composer would refuse to install them. We still test against them because the
          # package declares support for them, but only in this CI matrix.
          composer config audit.block-insecure false
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --with-all-dependencies --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
